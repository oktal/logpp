name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build-ubuntu:
    strategy:
      matrix:
        include:
          - cc: gcc-9
            cxx: g++-9
            packages: gcc-9 g++-9
          - cc: clang-10
            cxx: clang++-10
            packages: clang-10
          
    runs-on: ubuntu-latest
    name: Ubuntu - ${{ matrix.cc }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v2

      - name: Install compiler
        run: sudo apt install ${{ matrix.packages }}

      - name: Install conan
        run: python -m pip install "conan>=2.1,<3"

      - name: Create conan profile
        run: conan profile detect

      - name: Show conan profile
        run: conan profile show
      
      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build-${{ matrix.cc }}

      - name: Fetch dependencies
        working-directory: ${{github.workspace}}/build-${{ matrix.cc }}
        shell: bash
        run: conan install .. --output-folder=. -o "&:build_tests=True" -s compiler.cppstd=17 --build=missing
    
      - name: Build
        working-directory: ${{github.workspace}}/build-${{ matrix.cc }}
        shell: bash
        run: conan build .. --output-folder=. -o "&:build_tests=True" -s compiler.cppstd=17
  build-windows:
    runs-on: windows-latest
    name: Windows - msvc

    steps:
      - uses: actions/checkout@v2

      - name: Install conan
        run: python -m pip install "conan>=2.1,<3"

      - name: Create conan profile
        run: conan profile detect

      - name: Show conan profile
        run: conan profile show

      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build-msvc

      - name: Fetch dependencies
        working-directory: ${{github.workspace}}/build-msvc
        run: conan install .. --output-folder=. -o "&:build_tests=True" -s compiler.cppstd=17 --build=missing

      - name: Build
        working-directory: ${{github.workspace}}/build-msvc
        run: conan build .. --output-folder=. -o "&:build_tests=True" -s compiler.cppstd=17
